ridgeback_tab:
  title: Ridgeback Network Defense Content Strategy
  sections:
    - section: Ridgeback Network Defense Overview
      details: Ridgeback Network Defense focuses on cyber strategy, preemptive defense, automated attack interdiction, and active attack disruption. Its central position is that cybersecurity should impose cost, uncertainty, and disadvantage on attackers before they can act successfully. Ridgeback helps organizations regain the initiative instead of waiting for alerts, incidents, or successful compromise.
    - section: Core Strategic Narrative
      details: Traditional cybersecurity programs are often designed around detection, containment, and response. Ridgeback's point of view is that defenders should act earlier. AI is accelerating the tempo of cyber conflict, compressing attacker timelines and exposing the limits of defensive architectures built for a slower era. Ridgeback content should help executives, boards, CISOs, operators, and security teams understand how to move from reactive defense toward preemptive action.
    - section: Primary Audiences
      details: |-
        CEOs and executive leadership
        Corporate boards
        CISOs and security leaders
        Security architects and operators
        SOC leaders and analysts
        Critical infrastructure organizations
        Government and regulated enterprises
        Cybersecurity strategists and practitioners
    - section: Voice and Editorial Direction
      details: |-
        Strategic
        Direct
        Intelligent
        Credible
        Clear enough for executives
        Substantive enough for practitioners
        Focused on strategy rather than product promotion
        Willing to challenge conventional cybersecurity assumptions
    - section: Avoid
      details: |-
        Generic fear-based cybersecurity content
        Overly technical jargon without strategic context
        Empty AI commentary
        Vendor-heavy promotional language
        Claims that one technology solves every security problem
    - section: Commercial Bridge
      details: Content should lead audiences toward understanding Ridgeback's approach without turning every post into a sales pitch. Use CTAs such as Follow Ridgeback Network Defense, Watch Breach of Protocol, Join the live discussion, Share the issue with your security leadership team, Evaluate where your organization enters the defensive timeline, and Speak with Ridgeback about preemptive defense.
  content_pillars:
    - pillar: Cyber Strategy and Leadership
      purpose: Help leaders understand the strategic cost of staying reactive.
      core_audience: CEOs, boards, CISOs
      sample_topics:
        - Why speed matters in cyber conflict
        - How leaders measure defensive initiative
        - What the board should ask about preemptive security
      cta: Share the issue with your security leadership team
      formats:
        - Executive post
        - Carousel
        - Board memo
        - Short video
    - pillar: Preemptive Defense
      purpose: Explain how organizations can act before attackers complete their objectives.
      core_audience: CISOs, security architects, operators
      sample_topics:
        - Detection-first blind spots
        - Early intervention models
        - Preemptive control design
      cta: Evaluate where your organization enters the defensive timeline
      formats:
        - Framework post
        - Clip
        - Technical explainer
        - Live discussion teaser
    - pillar: Automated Attack Interdiction
      purpose: Show how automation can disrupt attacker progress earlier and more consistently.
      core_audience: Security leaders, SOC teams, architects
      sample_topics:
        - Automating attacker friction
        - Response speed vs interdiction speed
        - Operationalizing machine-speed defense
      cta: Speak with Ridgeback about preemptive defense
      formats:
        - Diagram post
        - How-it-works article
        - Show segment
        - Clip
    - pillar: Active Attack Disruption
      purpose: Translate active disruption into defensible strategic action, not hype.
      core_audience: CISOs, practitioners, regulated enterprises
      sample_topics:
        - Disrupting attacker paths
        - Reducing attacker freedom of movement
        - Operational thresholds for disruption
      cta: Join the live discussion
      formats:
        - Text post
        - Panel prompt
        - Clip
        - Q&A graphic
    - pillar: AI and the Changing Tempo of Conflict
      purpose: Interpret AI-driven acceleration without generic futurism.
      core_audience: Executives, CISOs, strategists
      sample_topics:
        - Compressed attacker timelines
        - AI-enabled reconnaissance and exploitation
        - What changes when speed becomes the advantage
      cta: Watch Breach of Protocol
      formats:
        - Thought-leadership post
        - Newsletter
        - Clip
        - Event copy
    - pillar: Board-to-SOC Strategic Alignment
      purpose: Connect executive risk language to operator reality.
      core_audience: Boards, CEOs, CISOs, SOC leaders
      sample_topics:
        - Board questions that help operators
        - How SOC metrics support strategy
        - Closing the strategy-to-operations gap
      cta: Share the issue with your security leadership team
      formats:
        - Carousel
        - Memo
        - Roundtable topic
        - Company-page post
    - pillar: Current Cyber Threat Analysis
      purpose: Use current incidents as evidence for strategic lessons.
      core_audience: Security practitioners, analysts, leaders
      sample_topics:
        - What recent attacks reveal about timing
        - What supply-chain incidents expose
        - Why trusted access becomes weaponized
      cta: Follow Ridgeback Network Defense
      formats:
        - Breaking brief
        - Replay insight
        - Newsletter recap
        - Live event teaser
    - pillar: Breach of Protocol Episodes and Clips
      purpose: Turn each episode into a repeatable engine of strategic content.
      core_audience: Entire Ridgeback audience mix
      sample_topics:
        - Episode takeaways
        - Clip series themes
        - Replay insights
        - Host quotes
      cta: Watch Breach of Protocol
      formats:
        - LinkedIn Live event
        - Replay post
        - Short clips
        - Quote graphic
social_schedule_tab:
  title: Breach of Protocol Social Publishing System
  workbook_purpose: This tab is the operational publishing dashboard for Ridgeback. Build the week around durable strategic themes, then update the Breaking Threat Brief shortly before Friday's show.
  rows:
    - day: Monday
      content_slot: Previous Breach of Protocol clip or replay insight
      goal: Extend the life of the previous episode.
      focus: Pull forward one durable strategic takeaway from the last show.
      suggested_formats:
        - Short clip
        - Replay insight post
        - Quote graphic
      content_pillar: Breach of Protocol Episodes and Clips
      platform: LinkedIn
      owner: Reveting + Ridgeback
      asset_needed: Clip, caption, replay link
      draft_status: Not Started
      approval_status: Not Started
      scheduled_date: ""
      published_link: ""
      repurposing_status: Not Started
    - day: Tuesday
      content_slot: Scott Fogarty thought-leadership post
      goal: Advance Ridgeback's strategic point of view.
      focus: Cyber strategy, leadership, preemptive defense, or the changing tempo of conflict.
      suggested_formats:
        - Text post
        - Carousel
        - Framework post
      content_pillar: Cyber Strategy and Leadership
      platform: LinkedIn personal profile
      owner: Scott Fogarty
      asset_needed: Draft copy, optional graphic
      draft_status: Not Started
      approval_status: Not Started
      scheduled_date: ""
      published_link: ""
      repurposing_status: Not Started
