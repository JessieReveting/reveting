  event_publishing_strategy:
    - rule: Title strategy
      guidance: Use durable strategic themes rather than tying the event title entirely to one breaking-news story.
    - rule: Description structure
      guidance: Include one durable strategic issue, two or three planned discussion angles, and a clearly labeled Breaking Threat Brief section.
    - rule: Breaking Threat Brief
      guidance: Update shortly before the show based on the most important cyber news of the week.
    - rule: Why this works
      guidance: The event can be published several days in advance without becoming irrelevant if the weekly news cycle changes.
