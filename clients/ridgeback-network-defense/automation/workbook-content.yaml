        - Company-page post
        - Host teaser
      content_pillar: Current Cyber Threat Analysis
      platform: LinkedIn event + company page
      owner: Reveting
      asset_needed: Event copy, host notes, CTA
      draft_status: Not Started
      approval_status: Not Started
      scheduled_date: ""
      published_link: ""
      repurposing_status: Not Started
    - day: Thursday
