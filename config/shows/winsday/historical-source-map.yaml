    location: reveting/data/discovery/winsday_episodes.json
    access_method: local repository read
    identifier_field: show_key
    current_coverage: Active weekly episode schedule and distinct-guest evidence
    notes: Best structured source for multi-guest scheduling and readiness logic.
  - source_type: repository_json
    location: reveting/config/operations_rules.json and reveting/config/knowledge/show_preferences.json
    access_method: local repository read
    identifier_field: show_name
    current_coverage: Show-specific SOP, LinkedIn-first sequencing, and Hannah email cadence
